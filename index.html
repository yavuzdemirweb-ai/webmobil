<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6f00">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Yeni PWA Uygulaması">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hoşgeldiniz">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Hoşgeldiniz</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">🚀</div>
      <h1>Hoşgeldiniz</h1>
      <p>Progressive Web Uygulamanıza hoş geldiniz!</p>
      <button id="installBtn" class="btn">Uygulamayı Kur</button>
    <script>setTimeout(function(){var b=document.getElementById('installBtn');if(b&&b.style.display==='none')b.style.display='inline-block';},3000)</script>
    </div>
  </div>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
